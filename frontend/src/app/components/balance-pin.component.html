<div class="navbar gpay-nav">
  <div class="logo">Enter UPI PIN</div>
  <a class="link" routerLink="/dashboard">Back</a>
</div>

<div class="card pay-shell pin-shell gpay-surface">
  <h2>Authenticate to view balance</h2>

  <div class="pin-live" aria-label="UPI pin indicator">
    <span *ngFor="let slot of [0,1,2,3,4,5]; let i = index" [class.filled]="i < pin.length"></span>
  </div>
  <p class="pin-helper">Enter 4 to 6 digit UPI PIN</p>

  <div class="pin-pad">
    <button class="pin-key" type="button" (click)="appendDigit('1')">1</button>
    <button class="pin-key" type="button" (click)="appendDigit('2')">2</button>
    <button class="pin-key" type="button" (click)="appendDigit('3')">3</button>
    <button class="pin-key" type="button" (click)="appendDigit('4')">4</button>
    <button class="pin-key" type="button" (click)="appendDigit('5')">5</button>
    <button class="pin-key" type="button" (click)="appendDigit('6')">6</button>
    <button class="pin-key" type="button" (click)="appendDigit('7')">7</button>
    <button class="pin-key" type="button" (click)="appendDigit('8')">8</button>
    <button class="pin-key" type="button" (click)="appendDigit('9')">9</button>
    <button class="pin-key pin-key-muted" type="button" (click)="clearPin()">Clear</button>
    <button class="pin-key" type="button" (click)="appendDigit('0')">0</button>
    <button class="pin-key pin-key-muted" type="button" (click)="backspace()">⌫</button>
  </div>

  <button class="pay-cta" [disabled]="loading || pin.length < 4" (click)="checkBalance()">
    {{ loading ? 'Checking...' : 'Verify PIN' }}
  </button>

  <p class="pay-error" *ngIf="error">{{ error }}</p>
</div>
