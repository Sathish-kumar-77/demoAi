<div class="navbar">
  <div class="logo">UPI Payment</div>
  <a class="link" routerLink="/dashboard">Back</a>
</div>

<div class="card">
  <h2>Send Money</h2>

  <div class="form-group">
    <label>Search by phone or UPI ID</label>
    <input type="text" [ngModel]="query" (ngModelChange)="onQueryChange($event)" placeholder="9876543210 or name@upi" />
    <small *ngIf="!resolvedPayee && !resolving">Type 10-digit phone or UPI ID (with @)</small>
  </div>

  <div *ngIf="resolving" class="loading">Resolving payee...</div>

  <div *ngIf="resolvedPayee" class="card" style="padding: 12px; margin-bottom: 14px;">
    <div><strong>{{ resolvedPayee.name }}</strong> <span *ngIf="resolvedPayee.verified" class="badge-safe">Verified</span></div>
    <div *ngIf="isPhoneQuery">UPI ID: {{ resolvedPayee.upiId }}</div>
    <div *ngIf="!isPhoneQuery">Phone: {{ resolvedPayee.phone }}</div>
  </div>

  <p *ngIf="error" class="pay-error">{{ error }}</p>

  <div class="form-group">
    <label>Amount</label>
    <input type="number" [(ngModel)]="amount" />
  </div>

  <div class="form-group">
    <label>Remark</label>
    <input type="text" [(ngModel)]="remark" placeholder="Add note" />
  </div>

  <button class="primary-btn" [disabled]="amount <= 0 || resolving" (click)="pay()">
    {{ resolving ? 'Please wait...' : 'Pay' }}
  </button>
</div>
