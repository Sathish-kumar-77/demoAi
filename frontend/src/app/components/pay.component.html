<div class="navbar gpay-nav">
  <div class="logo">Send Money</div>
  <a class="link" routerLink="/dashboard">Back</a>
</div>

<div class="card pay-shell gpay-surface">
  <h2>Pay anyone on UPI</h2>

  <div class="payee-banner">
    <p>To mobile number or UPI ID</p>
    <input type="text" [ngModel]="query" (ngModelChange)="onQueryChange($event)" placeholder="9876543210 or name&#64;upi" />
    <small *ngIf="!resolvedPayee && !resolving">Enter 10-digit phone or UPI ID (with &#64;)</small>
  </div>

  <div *ngIf="resolving" class="loading">Finding payee...</div>

  <div class="sample-payees" *ngIf="samplePayees.length > 0">
    <p>Sample payees (tap to select):</p>
    <div class="chip-row">
      <button class="chip" type="button" *ngFor="let p of samplePayees" (click)="selectSample(p)">
        {{ p.name }} • {{ p.upiId }}
      </button>
    </div>
  </div>


  <div *ngIf="resolvedPayee" class="payee-card">
    <div><strong>{{ resolvedPayee.name }}</strong> <span *ngIf="resolvedPayee.verified" class="badge-safe">Verified</span></div>
    <div *ngIf="isPhoneQuery">UPI ID: {{ resolvedPayee.upiId }}</div>
    <div *ngIf="!isPhoneQuery">Phone: {{ resolvedPayee.phone }}</div>
  </div>

  <p *ngIf="error" class="pay-error">{{ error }}</p>

  <div class="amount-card">
    <label>Amount</label>
    <div class="currency-input">
      <span>₹</span>
      <input type="number" [(ngModel)]="amount" placeholder="0" />
    </div>
    <div class="chip-row">
      <button class="chip" type="button" (click)="amount = 100">+₹100</button>
      <button class="chip" type="button" (click)="amount = 500">+₹500</button>
      <button class="chip" type="button" (click)="amount = 1000">+₹1000</button>
    </div>
  </div>

  <div class="form-group">
    <label>Remark (optional)</label>
    <input type="text" [(ngModel)]="remark" placeholder="Dinner, rent, shopping..." />
  </div>

  <button class="pay-cta" [disabled]="amount <= 0 || resolving" (click)="pay()">
    {{ resolving ? 'Please wait...' : 'Proceed to UPI PIN' }}
  </button>
</div>
