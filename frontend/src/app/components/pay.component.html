<div class="navbar">
  <div class="logo">UPI Pay</div>
  <a class="link" routerLink="/dashboard">Back</a>
</div>

<div class="card">
  <h2>Send money</h2>
  <div class="form-group">
    <label>UPI ID</label>
    <input type="text" [(ngModel)]="upiId" placeholder="name@bank" />
  </div>
  <div class="form-group">
    <label>Amount (₹)</label>
    <input type="number" [(ngModel)]="amount" />
  </div>
  <div class="form-group">
    <label>Note</label>
    <textarea rows="3" [(ngModel)]="note"></textarea>
  </div>
  <div class="form-group">
    <label>Device ID</label>
    <input type="text" [(ngModel)]="deviceId" />
  </div>
  <div class="form-group">
    <label>City</label>
    <input type="text" [(ngModel)]="city" />
  </div>
  <button class="primary-btn" [disabled]="loading" (click)="submit()">
    Pay Now
  </button>
  <div class="loading" *ngIf="loading">Processing payment...</div>
  <p *ngIf="error" style="color: #b71c1c;">{{ error }}</p>
</div>
