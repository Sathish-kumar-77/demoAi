<div class="navbar">
  <div class="logo">Hi, UPI User</div>
  <button class="primary-btn" (click)="logout()">Logout</button>
</div>

<div class="card">
  <div class="balance-box">
    <span>View Balance</span>
    <h1 *ngIf="balance !== null">₹ {{ balance | number: '1.2-2' }}</h1>
    <h1 *ngIf="balance === null">₹ •••••</h1>
    <button class="primary-btn" style="margin-top: 10px;" (click)="viewBalance()">Check with UPI PIN</button>
    <p class="pay-error" *ngIf="balanceError">{{ balanceError }}</p>
  </div>

  <h2 style="margin-top: 16px;">Quick actions</h2>
  <div class="tile-grid">
    <div class="tile" (click)="navigate('/pay')">
      <h3>Pay</h3>
      <p>Send money securely</p>
    </div>
    <div class="tile" (click)="navigate('/history')">
      <h3>History</h3>
      <p>View transactions</p>
    </div>
    <div class="tile" (click)="navigate('/profile')">
      <h3>Profile</h3>
      <p>Manage account</p>
    </div>
  </div>
</div>
