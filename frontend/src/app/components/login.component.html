<div class="card">
  <div class="navbar">
    <div class="logo">UPI Fraud Detection</div>
  </div>
  <h2>{{ isRegister ? 'Create account' : 'Welcome back' }}</h2>
  <p>Secure payments with real-time fraud detection.</p>

  <div class="form-group">
    <label>Email</label>
    <input type="email" [(ngModel)]="email" placeholder="you@example.com" />
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" [(ngModel)]="password" placeholder="••••••" />
  </div>
  <button class="primary-btn" (click)="submit()">
    {{ isRegister ? 'Register' : 'Login' }}
  </button>
  <p *ngIf="error" style="color: #b71c1c; margin-top: 12px;">{{ error }}</p>

  <p style="margin-top: 16px;">
    <span class="link" (click)="toggleMode()">
      {{ isRegister ? 'Already have an account? Login' : 'New here? Register' }}
    </span>
  </p>
</div>
